name: CI Backend

# A qualidade é garantida pela suíte E2E (staging efêmero) em e2e/.
# Este workflow valida apenas o build do backend (independente do frontend).
# O frontend tem seu próprio workflow (ci-frontend.yml) com filtro de path.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar
        run: ./mvnw --batch-mode -DskipTests compile