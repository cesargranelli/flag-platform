spring:
  application:
    name: flag-platform

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

  datasource:
    url: jdbc:postgresql://localhost:5432/flagplatform
    username: flagplatform
    password: flagplatform
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: platform
        format_sql: true

  flyway:
    enabled: true
    schemas:
      - platform
    locations:
      - classpath:db/migration
    default-schema: platform

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Origens adicionais liberadas no CORS (ex.: frontends publicados),
# separadas por vírgula. Localhost/127.0.0.1 em qualquer porta já são
# liberados por padrão para o dev server do Flutter Web.
app:
  cors:
    allowed-origins:
  jwt:
    # Em produção, definir via variável de ambiente JWT_SECRET (mín. 32 bytes).
    secret: ${JWT_SECRET:flag-platform-development-secret-change-me-now}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  security:
    rate-limit:
      # Anti brute-force no login: máx. tentativas por IP na janela.
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${LOGIN_WINDOW_SECONDS:300}
    password-reset:
      # Validade do token de redefinição de senha.
      expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:60}

  mail:
    # SMTP ainda não configurado. Quando true, o token de redefinição é enviado
    # por e-mail; quando false (dev), o token é retornado na resposta.
    enabled: ${MAIL_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    br.com.flagplatform: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
