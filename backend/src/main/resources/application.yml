spring:
  application:
    name: flag-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/flagplatform
    username: flagplatform
    password: flagplatform
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: platform
        format_sql: true

  flyway:
    enabled: true
    schemas: platform
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    br.com.flagplatform: DEBUG
    org.springframework.security: INFO
