spring:
  application:
    name: flag-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/flagplatform
    username: flagplatform
    password: flagplatform
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: platform
        format_sql: true

  flyway:
    enabled: true
    schemas:
      - platform
    locations:
      - classpath:db/migration
    default-schema: platform

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    br.com.flagplatform: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
