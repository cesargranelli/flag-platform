spring:
  test:
    database:
      replace: none
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: platform
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas:
      - platform
    locations:
      - classpath:db/migration
    default-schema: platform

  security:
    user:
      name: test
      password: test

app:
  jwt:
    secret: test-secret-with-at-least-32-bytes-0000000
    expiration-seconds: 3600
