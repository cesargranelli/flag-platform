name: flag_platform
description: Plataforma de acompanhamento de campeonatos de Flag Football
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: 5.4.3+1

  # State management
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5

  # Navigation
  go_router: 14.2.0

  # UI
  cupertino_icons: 1.0.8
  cached_network_image: 3.3.1
  shimmer: 3.0.0
  intl: 0.19.0

  # Storage
  shared_preferences: 2.3.1
  flutter_secure_storage: 9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  build_runner: 2.4.11
  riverpod_generator: 2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
