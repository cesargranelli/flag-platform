name: flag_platform_frontend
description: "Monorepo Flutter do Flag Platform (Public App, Referee App, Admin Web + packages compartilhados)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

workspace:
  - apps/*
  - packages/*

dev_dependencies:
  melos: ^8.2.2

melos:
  scripts:
    analyze:
      run: melos exec -- flutter analyze
      description: Roda flutter analyze em todos os packages.
    clean:
      run: melos exec -- flutter clean
      description: Limpa os artefatos de build de todos os packages.
